<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StreamFocus — Session Music</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #07090c;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.07);
      --neon: #b8ff57;
      --neon-dim: rgba(184,255,87,0.12);
      --accent: #ff6b35;
      --blue: #57b8ff;
      --text: #e2e8f2;
      --muted: #4a5568;
      --wave-color: #b8ff57;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Animated background gradient */
    .bg-aura {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .aura-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0;
      transition: opacity 2s ease, background 2s ease;
    }

    .aura-blob.active { opacity: 0.15; }

    .blob-a {
      width: 600px; height: 600px;
      background: var(--neon);
      top: -200px; left: -100px;
      animation: blobDrift 12s ease-in-out infinite;
    }

    .blob-b {
      width: 400px; height: 400px;
      background: var(--accent);
      bottom: -150px; right: -100px;
      animation: blobDrift 15s ease-in-out infinite reverse 3s;
    }

    .blob-c {
      width: 300px; height: 300px;
      background: var(--blue);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation: blobDrift 10s ease-in-out infinite 6s;
    }

    @keyframes blobDrift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -25px) scale(1.08); }
      66% { transform: translate(-20px, 20px) scale(0.93); }
    }

    /* Scanline overlay */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.1) 2px,
        rgba(0,0,0,0.1) 4px
      );
      pointer-events: none;
      z-index: 200;
    }

    /* ── Main card ── */
    .card {
      position: relative;
      z-index: 10;
      width: min(480px, 94vw);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px;
      backdrop-filter: blur(20px);
      animation: cardIn 0.7s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Header */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .back-link {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--text); }

    .pill-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(184,255,87,0.1);
      border: 1px solid rgba(184,255,87,0.25);
      color: var(--neon);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 20px;
    }

    .pill-badge .dot {
      width: 5px; height: 5px;
      background: var(--neon);
      border-radius: 50%;
    }

    /* Album art area */
    .album-area {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 28px;
      background: linear-gradient(135deg, #111418 0%, #0d1117 100%);
    }

    #albumBg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    .album-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(7,9,12,0.2) 0%,
        rgba(7,9,12,0.7) 100%
      );
    }

    /* Vinyl record (shown in loading state) */
    .vinyl {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s;
    }

    .vinyl.hidden { opacity: 0; pointer-events: none; }

    .vinyl-disc {
      width: 160px; height: 160px;
      border-radius: 50%;
      background: 
        radial-gradient(circle at 50%, #1a1a1a 0%, #0a0a0a 30%, #222 31%, #111 50%, #333 51%, #1a1a1a 100%);
      border: 2px solid rgba(255,255,255,0.05);
      position: relative;
      animation: vinylSpin 3s linear infinite paused;
      box-shadow: 0 0 60px rgba(0,0,0,0.8);
    }

    .vinyl-disc.spinning { animation-play-state: running; }

    .vinyl-disc::before {
      content: '';
      position: absolute;
      inset: 45%;
      background: var(--neon);
      border-radius: 50%;
      box-shadow: 0 0 20px var(--neon);
    }

    .vinyl-disc::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: repeating-radial-gradient(
        circle at 50% 50%,
        transparent 0px,
        transparent 6px,
        rgba(255,255,255,0.02) 6px,
        rgba(255,255,255,0.02) 7px
      );
    }

    @keyframes vinylSpin { to { transform: rotate(360deg); } }

    /* Waveform visualizer */
    #waveCanvas {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      opacity: 0;
      transition: opacity 0.5s;
    }

    #waveCanvas.visible { opacity: 1; }

    /* Session info */
    .session-info {
      margin-bottom: 20px;
    }

    .session-type {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .session-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 38px;
      letter-spacing: 0.03em;
      line-height: 1;
      color: var(--text);
    }

    .session-name .highlight { color: var(--neon); }

    .session-genre {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
      font-style: italic;
      min-height: 20px;
    }

    /* Progress bar */
    .progress-area {
      margin-bottom: 20px;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--neon);
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s linear;
      box-shadow: 0 0 8px var(--neon);
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 11px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 28px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      transition: color 0.2s, transform 0.1s;
      padding: 8px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:hover { color: var(--text); transform: scale(1.1); }
    .ctrl-btn:active { transform: scale(0.95); }

    .ctrl-btn.primary {
      width: 56px; height: 56px;
      background: var(--neon);
      color: #07090c;
      border-radius: 50%;
      box-shadow: 0 0 24px rgba(184,255,87,0.4);
      transition: all 0.2s;
    }

    .ctrl-btn.primary:hover {
      background: #ccff77;
      transform: scale(1.06);
      box-shadow: 0 0 36px rgba(184,255,87,0.6);
    }

    .ctrl-btn.primary:disabled {
      background: rgba(255,255,255,0.1);
      color: var(--muted);
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .ctrl-btn svg { pointer-events: none; }

    /* Volume */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .vol-icon { color: var(--muted); flex-shrink: 0; }

    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      background: var(--neon);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--neon);
    }

    /* Lyrics panel */
    .lyrics-panel {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      min-height: 64px;
      max-height: 120px;
      overflow-y: auto;
      margin-bottom: 24px;
      display: none;
    }

    .lyrics-panel.visible { display: block; }

    .lyrics-panel p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
      font-style: italic;
      white-space: pre-wrap;
    }

    /* Generate button */
    .gen-btn {
      width: 100%;
      padding: 14px;
      background: var(--neon);
      color: #07090c;
      border: none;
      border-radius: 10px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 0.08em;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .gen-btn:hover {
      background: #ccff77;
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(184,255,87,0.3);
    }

    .gen-btn:active { transform: translateY(0); }

    .gen-btn:disabled {
      background: rgba(255,255,255,0.08);
      color: var(--muted);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Loading spinner inside button */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(7,9,12,0.3);
      border-top-color: #07090c;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .spinner.visible { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Status messages */
    #statusMsg {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 12px;
      min-height: 18px;
      letter-spacing: 0.04em;
    }

    #statusMsg.error { color: #ff6b6b; }
    #statusMsg.success { color: var(--neon); }

    /* Scrollbar styling */
    .lyrics-panel::-webkit-scrollbar { width: 3px; }
    .lyrics-panel::-webkit-scrollbar-track { background: transparent; }
    .lyrics-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── Loading overlay ── */
    #genOverlay {
      position: absolute;
      inset: 0;
      border-radius: 14px;
      background: rgba(7,9,12,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      backdrop-filter: blur(4px);
    }

    #genOverlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .gen-ring {
      width: 48px; height: 48px;
      border: 2px solid rgba(184,255,87,0.2);
      border-top-color: var(--neon);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .gen-label {
      font-size: 13px;
      color: var(--neon);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      animation: fadePulse 1.5s ease infinite;
    }

    @keyframes fadePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Regenerate small button */
    .regen-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 0.06em;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
      width: 100%;
      display: none;
    }

    .regen-btn.visible { display: block; }
    .regen-btn:hover { border-color: var(--neon); color: var(--neon); }
  </style>
</head>
<body>
  <!-- Background aura -->
  <div class="bg-aura">
    <div class="aura-blob blob-a"></div>
    <div class="aura-blob blob-b"></div>
    <div class="aura-blob blob-c"></div>
  </div>
  <div class="scanlines"></div>

  <div class="card">
    <!-- Header -->
    <div class="card-header">
      <a href="session.html" class="back-link">← Back to Session</a>
      <div class="pill-badge">
        <span class="dot"></span>
        Lyria AI Music
      </div>
    </div>

    <!-- Album art -->
    <div class="album-area">
      <div id="albumBg"></div>
      <div class="album-overlay"></div>

      <!-- Vinyl record shown while loading/idle -->
      <div class="vinyl" id="vinyl">
        <div class="vinyl-disc" id="vinylDisc"></div>
      </div>

      <!-- Waveform canvas shown when playing -->
      <canvas id="waveCanvas"></canvas>

      <!-- Overlay during generation -->
      <div id="genOverlay">
        <div class="gen-ring"></div>
        <div class="gen-label" id="genOverlayMsg">Composing your track...</div>
      </div>
    </div>

    <!-- Session info -->
    <div class="session-info">
      <div class="session-type">Now Playing For</div>
      <div class="session-name">
        <span class="highlight" id="sessionDisplay">—</span>
      </div>
      <div class="session-genre" id="genreHint"></div>
    </div>

    <!-- Progress -->
    <div class="progress-area">
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="time-row">
        <span id="timeCurrent">0:00</span>
        <span id="timeDuration">0:30</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn" id="restartBtn" title="Restart" disabled>
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
          <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
        </svg>
      </button>

      <button class="ctrl-btn primary" id="playBtn" disabled>
        <!-- Play icon -->
        <svg id="iconPlay" width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <!-- Pause icon -->
        <svg id="iconPause" width="22" height="22" fill="currentColor" viewBox="0 0 24 24" style="display:none">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
      </button>

      <button class="ctrl-btn" id="loopBtn" title="Loop">
        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
          <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
        </svg>
      </button>
    </div>

    <!-- Volume -->
    <div class="volume-row">
      <svg class="vol-icon" width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
      </svg>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.85"/>
    </div>

    <!-- Lyrics panel (appears if Lyria returns lyrics) -->
    <div class="lyrics-panel" id="lyricsPanel">
      <p id="lyricsText"></p>
    </div>

    <!-- Generate button -->
    <button class="gen-btn" id="genBtn">
      <div class="spinner" id="btnSpinner"></div>
      <span id="genBtnText">🎵 Generate Session Music</span>
    </button>

    <button class="regen-btn" id="regenBtn">↻ Generate a different track</button>

    <div id="statusMsg"></div>
  </div>

  <!-- Hidden audio element -->
  <audio id="audioEl" preload="auto"></audio>

  <script>
    // ─── State ────────────────────────────────────────────────────────────────
    const sessionName = localStorage.getItem('sessionName') || 'Focus Session';
    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let animFrameId = null;
    let isLooping = false;

    const audioEl = document.getElementById('audioEl');
    const playBtn = document.getElementById('playBtn');
    const iconPlay = document.getElementById('iconPlay');
    const iconPause = document.getElementById('iconPause');
    const restartBtn = document.getElementById('restartBtn');
    const loopBtn = document.getElementById('loopBtn');
    const progressFill = document.getElementById('progressFill');
    const progressTrack = document.getElementById('progressTrack');
    const timeCurrent = document.getElementById('timeCurrent');
    const timeDuration = document.getElementById('timeDuration');
    const volumeSlider = document.getElementById('volumeSlider');
    const genBtn = document.getElementById('genBtn');
    const regenBtn = document.getElementById('regenBtn');
    const btnSpinner = document.getElementById('btnSpinner');
    const genBtnText = document.getElementById('genBtnText');
    const statusMsg = document.getElementById('statusMsg');
    const lyricsPanel = document.getElementById('lyricsPanel');
    const lyricsText = document.getElementById('lyricsText');
    const genOverlay = document.getElementById('genOverlay');
    const genOverlayMsg = document.getElementById('genOverlayMsg');
    const waveCanvas = document.getElementById('waveCanvas');
    const vinyl = document.getElementById('vinyl');
    const vinylDisc = document.getElementById('vinylDisc');
    const albumBg = document.getElementById('albumBg');

    // ─── Init ──────────────────────────────────────────────────────────────────
    document.getElementById('sessionDisplay').textContent = sessionName;
    document.title = `Music — ${sessionName}`;

    // Set genre hint based on session
    document.getElementById('genreHint').textContent = detectGenre(sessionName);

    // Load background image from Pollinations (same as session page)
    const bgPrompt = encodeURIComponent(`atmospheric music studio ${sessionName} theme, dark moody lighting, neon accents, 4k`);
    const bgUrl = `https://image.pollinations.ai/prompt/${bgPrompt}?width=800&height=800&nologo=true&seed=42`;
    const bgImg = new Image();
    bgImg.onload = () => {
      albumBg.style.backgroundImage = `url("${bgUrl}")`;
      albumBg.style.opacity = '1';
    };
    bgImg.src = bgUrl;

    // Activate aura blobs
    setTimeout(() => {
      document.querySelectorAll('.aura-blob').forEach(b => b.classList.add('active'));
    }, 300);

    // ─── Genre hint ───────────────────────────────────────────────────────────
    function detectGenre(name) {
      const n = name.toLowerCase();
      if (n.includes('study') || n.includes('homework') || n.includes('exam')) return 'Lo-fi Hip Hop · Soft Piano · Focus Beats';
      if (n.includes('cod') || n.includes('hack') || n.includes('program') || n.includes('dev')) return 'Synthwave · Dark Electro · Cyberpunk';
      if (n.includes('design') || n.includes('art') || n.includes('creat')) return 'Ambient · Dreamy Pads · Ethereal';
      if (n.includes('workout') || n.includes('gym') || n.includes('run')) return 'High Energy EDM · 140 BPM · Trap';
      if (n.includes('read') || n.includes('essay') || n.includes('writ')) return 'Acoustic · Soft Guitar · Coffee Shop';
      if (n.includes('deep work') || n.includes('focus') || n.includes('grind')) return 'Minimal Techno · Flow State · Deep Focus';
      if (n.includes('chill') || n.includes('relax') || n.includes('break')) return 'Chillhop · Jazz Loops · Mellow';
      return 'AI-Curated · Session Optimized';
    }

    // ─── Generate music ───────────────────────────────────────────────────────
    async function generateMusic() {
      setLoading(true);
      setStatus('');

      const messages = [
        'Composing your track...',
        'Lyria is writing the melody...',
        'Adding layers and texture...',
        'Mixing down...',
        'Almost ready...'
      ];
      let msgIdx = 0;
      genOverlayMsg.textContent = messages[0];
      const msgInterval = setInterval(() => {
        msgIdx = (msgIdx + 1) % messages.length;
        genOverlayMsg.textContent = messages[msgIdx];
      }, 2200);

      try {
        const res = await fetch('/api/generate-music', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionName })
        });

        clearInterval(msgInterval);

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.details || err.error || 'Server error');
        }

        const data = await res.json();

        // Build a playable audio blob URL from the base64
        const audioBytes = atob(data.audioBase64);
        const byteArr = new Uint8Array(audioBytes.length);
        for (let i = 0; i < audioBytes.length; i++) {
          byteArr[i] = audioBytes.charCodeAt(i);
        }
        const blob = new Blob([byteArr], { type: data.mimeType || 'audio/wav' });
        const url = URL.createObjectURL(blob);

        // Set audio src
        if (audioEl.src && audioEl.src.startsWith('blob:')) {
          URL.revokeObjectURL(audioEl.src);
        }
        audioEl.src = url;
        audioEl.volume = parseFloat(volumeSlider.value);

        // Show lyrics if any
        if (data.lyrics?.trim()) {
          lyricsText.textContent = data.lyrics;
          lyricsPanel.classList.add('visible');
        } else {
          lyricsPanel.classList.remove('visible');
        }

        setLoading(false);
        enablePlayer();
        setStatus('Track ready! Hit play ▶', 'success');
        regenBtn.classList.add('visible');

        // Auto-play
        playAudio();

      } catch (err) {
        clearInterval(msgInterval);
        setLoading(false);
        setStatus(`Error: ${err.message}`, 'error');
        console.error(err);
      }
    }

    // ─── Audio playback ───────────────────────────────────────────────────────
    function playAudio() {
      if (!audioEl.src) return;

      // Set up Web Audio analyser on first play
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        sourceNode = audioCtx.createMediaElementSource(audioEl);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);
      }

      audioEl.play();
    }

    audioEl.addEventListener('play', () => {
      iconPlay.style.display = 'none';
      iconPause.style.display = 'block';
      vinyl.classList.add('hidden');
      vinylDisc.classList.add('spinning');
      waveCanvas.classList.add('visible');
      drawWaveform();
    });

    audioEl.addEventListener('pause', () => {
      iconPlay.style.display = 'block';
      iconPause.style.display = 'none';
      vinylDisc.classList.remove('spinning');
      cancelAnimationFrame(animFrameId);
    });

    audioEl.addEventListener('ended', () => {
      iconPlay.style.display = 'block';
      iconPause.style.display = 'none';
      vinylDisc.classList.remove('spinning');
      waveCanvas.classList.remove('visible');
      vinyl.classList.remove('hidden');
      progressFill.style.width = '0%';
      timeCurrent.textContent = '0:00';
      cancelAnimationFrame(animFrameId);
      if (isLooping) {
        audioEl.currentTime = 0;
        playAudio();
      }
    });

    audioEl.addEventListener('timeupdate', () => {
      if (!audioEl.duration) return;
      const pct = (audioEl.currentTime / audioEl.duration) * 100;
      progressFill.style.width = `${pct}%`;
      timeCurrent.textContent = fmtTime(audioEl.currentTime);
    });

    audioEl.addEventListener('loadedmetadata', () => {
      timeDuration.textContent = fmtTime(audioEl.duration);
    });

    // ─── Play/pause button ────────────────────────────────────────────────────
    playBtn.addEventListener('click', () => {
      if (audioEl.paused) {
        if (audioCtx?.state === 'suspended') audioCtx.resume();
        playAudio();
      } else {
        audioEl.pause();
      }
    });

    restartBtn.addEventListener('click', () => {
      audioEl.currentTime = 0;
      if (audioEl.paused) playAudio();
    });

    loopBtn.addEventListener('click', () => {
      isLooping = !isLooping;
      loopBtn.style.color = isLooping ? 'var(--neon)' : '';
      audioEl.loop = isLooping;
    });

    // Click on progress track to seek
    progressTrack.addEventListener('click', (e) => {
      if (!audioEl.duration) return;
      const rect = progressTrack.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      audioEl.currentTime = ratio * audioEl.duration;
    });

    // Volume slider
    volumeSlider.addEventListener('input', () => {
      audioEl.volume = parseFloat(volumeSlider.value);
    });

    // ─── Waveform visualizer ──────────────────────────────────────────────────
    function drawWaveform() {
      if (!analyser) return;
      const ctx = waveCanvas.getContext('2d');
      const W = waveCanvas.offsetWidth;
      const H = waveCanvas.offsetHeight;
      waveCanvas.width = W;
      waveCanvas.height = H;

      const bufLen = analyser.frequencyBinCount;
      const dataArr = new Uint8Array(bufLen);

      function draw() {
        animFrameId = requestAnimationFrame(draw);
        analyser.getByteFrequencyData(dataArr);

        ctx.clearRect(0, 0, W, H);

        const barW = (W / bufLen) * 2.5;
        let x = 0;

        for (let i = 0; i < bufLen; i++) {
          const barH = (dataArr[i] / 255) * H * 0.9;
          const alpha = 0.4 + (dataArr[i] / 255) * 0.6;
          ctx.fillStyle = `rgba(184,255,87,${alpha})`;
          ctx.fillRect(x, H - barH, barW - 1, barH);
          x += barW;
        }
      }

      draw();
    }

    // ─── UI helpers ───────────────────────────────────────────────────────────
    function setLoading(on) {
      genBtn.disabled = on;
      genOverlay.classList.toggle('active', on);
      btnSpinner.classList.toggle('visible', on);
      genBtnText.textContent = on ? 'Generating...' : '🎵 Generate Session Music';
    }

    function enablePlayer() {
      playBtn.disabled = false;
      restartBtn.disabled = false;
    }

    function setStatus(msg, type = '') {
      statusMsg.textContent = msg;
      statusMsg.className = type;
    }

    function fmtTime(s) {
      if (isNaN(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = String(Math.floor(s % 60)).padStart(2, '0');
      return `${m}:${sec}`;
    }

    // ─── Button events ────────────────────────────────────────────────────────
    genBtn.addEventListener('click', generateMusic);
    regenBtn.addEventListener('click', generateMusic);

    // Auto-generate on page load if no audio yet
    // (optional: comment out if you want manual trigger only)
    // setTimeout(generateMusic, 600);
  </script>
</body>
</html>
